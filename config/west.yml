manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: onnenon
      url-base: https://github.com/onnenon
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned to v0.3.0: ZMK main (Dec 2025+) renamed nice_nano_v2 to nice_nano
      # and moved to LVGL v9, which breaks the nice_nano_v2 board name and the
      # nice_view display code used by the smallwave config.
      revision: v0.3.0
      import: app/west.yml
    # ZMK modules
    # - name: zmk-adaptive-key
    #   path: modules/zmk/adaptive-key
    # - name: zmk-auto-layer
    #   path: modules/zmk/auto-layer
    # - name: zmk-helpers
    #   path: modules/zmk/helpers
    # - name: zmk-leader-key
    #   revision: v0.1+locality
    #   path: modules/zmk/leader-key
    # - name: zmk-tri-state
    #   path: modules/zmk/tri-state


    - name: zmk-config-smallwave
      remote: onnenon
      revision: main
  self:
    path: config
